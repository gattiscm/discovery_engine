[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "discovery-engine"
version = "0.1.0"
description = "Novelty detection and discovery framework"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Cameron M. Gattis"}
]

dependencies = [
    "numpy",
    "pandas"
]

[tool.setuptools]
packages = [
    "engine",
    "features",
    "utilities",
    "visualizations"
]